# Dependabot's npm ecosystem supports pnpm v7 through v10: https://docs.github.com/en/code-security/dependabot/ecosystems-supported-by-dependabot/supported-ecosystems-and-repositories
name: Update dependencies

on:
  schedule:
    - cron: '0 21 * * 0' # Monday 06:00 JST
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: Update and verify
    if: github.repository == 'eve0415/pdfwright'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: false

      - name: Update dependencies
        run: |
          set -euo pipefail
          pnpm self-update "$(pnpm --version | cut -d . -f 1)"
          node_major="$(node -p "require('./package.json').devEngines.runtime.version.split('.')[0]")"
          pnpm runtime set node "$node_major"
          rm -rf node_modules pnpm-lock.yaml
          pnpm update --recursive --latest

      - name: Install Playwright browser and system dependencies
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Check
        run: pnpm run check

      - name: Prepare changed files
        id: changes
        run: |
          if git diff --quiet; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          else
            git diff --binary > dependency-update.patch
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload changed files
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-update
          path: dependency-update.patch
          retention-days: 1

  pull-request:
    name: Open pull request
    needs: update
    if: needs.update.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      # Push the verified patch and maintain its pull request.
      contents: write
      pull-requests: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download changed files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-update

      - name: Commit and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The update touches only manifests and the lockfile; any other path in the patch is dropped rather than pushed.
          git apply --index --include=package.json --include='packages/*/package.json' --include=pnpm-lock.yaml --include=pnpm-workspace.yaml dependency-update.patch
          git -c core.hooksPath=/dev/null \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore: update dependencies'
          gh auth setup-git
          git push --force origin HEAD:refs/heads/chore/update-dependencies
          pr_title='chore: update dependencies'
          pr_body='Automated dependency updates verified by the full gate.'
          pr_number="$(gh pr list --head chore/update-dependencies --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$pr_title" --body "$pr_body"
          else
            gh pr create --title "$pr_title" --body "$pr_body" --base "$BASE" --head chore/update-dependencies
          fi
